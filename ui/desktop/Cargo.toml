[package]
name = "lilypad-desktop"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lilypad desktop GUI built with Iced"

[dependencies]
# GUI framework
# NOTE: no "image" feature. It is unused (the GUI draws no bitmaps, only Nerd
# Font glyphs and canvas vectors) and it turns on image/default, whose "avif"
# codec drags in ravif -> rav1e, a full AV1 video encoder, plus ~50 crates of
# asm/SIMD code.
iced = { version = "0.14", features = ["advanced", "tokio", "canvas"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

# Lilypad service layer (owns all vault logic)
lilypad-app = { path = "../../lilypad-app" }
lilypad-common = { path = "../../lilypad-common" }

# Security
zeroize.workspace = true

# System integration
webbrowser = "1.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
