[package]
name = "lilypad-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Lilypad Contributors"]
license = "Apache-2.0"
description = "Lilypad desktop GUI built with egui/eframe"

[dependencies]
eframe = { version = "0.33.2", default-features = true, features = ["wgpu"] }
egui = "0.33.2"
directories = "5.0.1"
webbrowser = "1.0.6"
rand = "0.8.5"
anyhow = "1.0.95"
lilypad-core = { path = "../../lilypad-core" }
lilypad-storage = { path = "../../lilypad-storage" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
