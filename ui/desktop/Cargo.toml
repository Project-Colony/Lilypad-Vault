[package]
name = "lilypad-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Lilypad Contributors"]
license = "Apache-2.0"
description = "Lilypad desktop GUI built with Iced"

[dependencies]
# GUI Framework - Iced
iced = { version = "0.13", features = ["advanced", "tokio", "image"] }

# Async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time"] }

# System integration
directories = "6.0.0"
webbrowser = "1.0.6"
rfd = "0.17.2"
arboard = "3.6.1"

# Data handling
rand = "0.8.5"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Security
zeroize.workspace = true

# Lilypad crates
lilypad-common = { path = "../../lilypad-common" }
lilypad-core = { path = "../../lilypad-core" }
lilypad-storage = { path = "../../lilypad-storage" }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging (optional, useful for debugging)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
