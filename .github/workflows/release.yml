name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build all release binaries
        run: cargo build --release --target ${{ matrix.target }} -p lilypad-desktop -p lilypad-cli -p lilypad-tui

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/lilypad-desktop lilypad-desktop-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/lilypad-cli lilypad-cli-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/lilypad-tui lilypad-tui-${{ matrix.target }}

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          copy target\${{ matrix.target }}\release\lilypad-desktop.exe lilypad-desktop-${{ matrix.target }}.exe
          copy target\${{ matrix.target }}\release\lilypad-cli.exe lilypad-cli-${{ matrix.target }}.exe
          copy target\${{ matrix.target }}\release\lilypad-tui.exe lilypad-tui-${{ matrix.target }}.exe

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilypad-desktop-${{ matrix.target }}
          path: lilypad-desktop-${{ matrix.target }}*

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilypad-cli-${{ matrix.target }}
          path: lilypad-cli-${{ matrix.target }}*

      - name: Upload TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lilypad-tui-${{ matrix.target }}
          path: lilypad-tui-${{ matrix.target }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
