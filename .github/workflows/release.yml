# Lilypad - release workflow
#
# Built from templates/sign-and-publish-caller.yml in Project-Colony-Resources.
# Each platform ships three binaries. The desktop app is the one Colony
# installs, so colony.json names it explicitly (auto-detection would look for
# lilypad-vault-<platform>, after the repository name):
#
#   lilypad-linux      lilypad-cli-linux      lilypad-tui-linux
#   lilypad-windows.exe lilypad-cli-windows.exe lilypad-tui-windows.exe
#   lilypad-macos      lilypad-cli-macos      lilypad-tui-macos
#   lilypad-macos-x86  lilypad-cli-macos-x86  lilypad-tui-macos-x86
#
# The build legs only build, check and upload artifacts; they never see a key.
# Authenticode (SignPath, once approved), the ed25519 .sig/.meta/.meta.sig,
# verification and publishing all happen in
# .github/workflows/sign-and-publish.yml of Project-Colony-Resources, in this
# same run. See design/releases.md there, section "Shared signing workflow".
#
# Action refs are pinned to commit SHAs on purpose: the called workflow handles
# the organisation's release signing key, and whoever can move a floating tag
# can read that secret.

name: Release

on:
  push:
    branches: [main]
  # Recovery path: finish an existing DRAFT release whose run failed.
  # release-please emits `release_created` once per release, so "Re-run all
  # jobs" on the original run makes it report nothing to do and every job
  # below skip. Start the dispatch from the tag ("Use workflow from: v0.2.0",
  # or `gh workflow run release.yml --ref v0.2.0 -f tag=v0.2.0`): with SignPath
  # on, sign-and-publish refuses a run whose commit is not the tag's, since
  # SignPath records the run's commit as the source of what it signs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing draft release to build, sign and publish (e.g. v0.2.0). Run from that same tag."
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Assembles a release PR from the conventional commits since the last release.
  # Merging that PR is what creates the tag; everything below runs only then.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input, on purpose: when it is set, the action
      # ignores both files below, and with them the changelog sections, the
      # extra files that carry the version, and the version in the manifest.
      # The release type lives in release-please-config.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please PUBLISHES the release - and moves /releases/latest -
      # before a single binary exists. For the whole build window every Colony
      # in the field would show an update badge whose every click fails. Held
      # as a draft here; sign-and-publish refuses anything else and publishes
      # it last, once every file is signed and verified on the release.
      - name: Hold the release as a draft until it is complete
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        # `-R` is not optional: this job has no `actions/checkout`, so `gh` has
        # no git remote to infer the repository from.
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  build:
    name: build ${{ matrix.platform }}
    needs: release-please
    # Runs on a merge that created a release, or on a recovery dispatch (when
    # release-please is skipped). NOT `always()`: a FAILED release-please must
    # stop the run at an empty draft.
    if: ${{ !cancelled() && !failure() && (needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch') }}
    # GitHub-hosted runners only: SignPath rejects a signing request if any
    # job leading to it ran on a self-hosted runner.
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            ext: ".exe"
          # "macos" is Apple Silicon, "macos-x86" is Intel. Colony picks between
          # them at runtime.
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86
            ext: ""

    env:
      # The GitHub OAuth App client ID that GitHub sync uses, compiled in by
      # lilypad-oauth (option_env!). A client ID is public, so it is a variable,
      # not a secret. Unset, the release still works, and sync explains that no
      # client ID was compiled in.
      LILYPAD_GITHUB_CLIENT_ID: ${{ vars.LILYPAD_GITHUB_CLIENT_ID }}

    steps:
      # The tag, not the branch: a recovery dispatch must rebuild the tagged
      # commit, since the .meta sidecar binds these bytes to that version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          targets: ${{ matrix.target }}

      # No build cache here: SignPath forbids release builds that reuse
      # outputs of earlier, unverified builds.

      # --locked: the release PR bumps Cargo.lock along with Cargo.toml (see
      # release-please-config.json), so a tag whose lock disagrees with its
      # manifest fails here instead of resolving something new.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p lilypad-desktop -p lilypad-cli -p lilypad-tui

      - name: Name the artifacts
        shell: bash
        env:
          DIR: target/${{ matrix.target }}/release
          P: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir dist
          cp "$DIR/lilypad-desktop$EXT" "dist/lilypad-$P$EXT"
          cp "$DIR/lilypad-cli$EXT" "dist/lilypad-cli-$P$EXT"
          cp "$DIR/lilypad-tui$EXT" "dist/lilypad-tui-$P$EXT"
          ls -l dist

      # A manifest can PARSE perfectly and still leave the program listed in
      # Colony with no Download button, because none of its files exist in the
      # release. `colony validate-manifest` given the asset names catches
      # exactly that. Linux only: one check per release is enough. No key is
      # on this runner: signing happens in sign-and-publish. Colony's binary
      # RUNS here, so its signature and signed .meta are checked first.
      - name: Validate colony.json
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
          # Colony's ed25519 release public key: RELEASE_PUBLIC_KEYS in
          # src/signing.rs of Project-Colony/Colony, as PEM. It is public.
          # Change it here when Colony's releases are signed with a new key.
          COLONY_RELEASE_PUB: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEARNjg3Nn8H6/aBg1unwGjkUTcrdTxERNefVaqU8cFu0s=
            -----END PUBLIC KEY-----
        run: |
          d=$(mktemp -d)
          gh release download -R Project-Colony/Colony -D "$d" \
            -p colony-linux -p colony-linux.sig -p colony-linux.meta -p colony-linux.meta.sig
          printf '%s' "$COLONY_RELEASE_PUB" > "$d/release.pub"
          openssl pkeyutl -verify -pubin -inkey "$d/release.pub" -rawin \
            -in "$d/colony-linux" -sigfile "$d/colony-linux.sig"
          openssl pkeyutl -verify -pubin -inkey "$d/release.pub" -rawin \
            -in "$d/colony-linux.meta" -sigfile "$d/colony-linux.meta.sig"
          digest=$(sha256sum "$d/colony-linux" | cut -d' ' -f1)
          grep -qx 'asset=colony-linux' "$d/colony-linux.meta" \
            && grep -qx "sha256=$digest" "$d/colony-linux.meta" \
            || { echo "::error::colony-linux.meta does not describe the downloaded colony-linux"; exit 1; }
          chmod +x "$d/colony-linux"
          "$d/colony-linux" validate-manifest colony.json \
            lilypad-linux lilypad-windows.exe lilypad-macos lilypad-macos-x86
          rm -rf "$d"

      # The signature proves provenance and says nothing about whether the
      # binary RUNS. An artefact built for the wrong architecture, or one that
      # aborts under the release profile, would otherwise be signed, published
      # and installed with every check green. Each binary answers --version
      # before touching a window or the terminal.
      - name: Smoke-test the artifacts
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        env:
          P: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          for bin in lilypad lilypad-cli lilypad-tui; do
            "./dist/$bin-$P$EXT" --version
          done

      # SignPath signs only an .exe whose version resource names the project
      # and carries its version (each binary's build.rs writes it). A build
      # that lost either would be refused at signing time, hours later; this
      # fails it here.
      - name: Check the Windows version resources
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $failed = $false
          foreach ($asset in 'lilypad-windows.exe', 'lilypad-cli-windows.exe', 'lilypad-tui-windows.exe') {
            $info = (Get-Item "dist\$asset").VersionInfo
            "$asset ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileVersion='$($info.FileVersion)' FileDescription='$($info.FileDescription)'"
            if ($info.ProductName -cne 'Lilypad' -or $info.ProductVersion -cne $version) {
              "::error::$asset has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Lilypad' and '$version'"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      # The Intel macOS artefacts are cross-compiled on an arm64 runner and
      # cannot be executed there, so assert their architecture instead.
      - name: Check the cross-compiled artifacts' architecture
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          for f in dist/*; do
            file "$f"
            file "$f" | grep -q 'x86_64' \
              || { echo "::error::$f is not an x86_64 binary"; exit 1; }
          done

      # The three files at the artifact root, under their release names. The
      # name prefix is what `artifact-pattern` below matches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  # Authenticode (once SignPath is on), .sig/.meta/.meta.sig over the final
  # bytes, upload to the draft, download again, verify, publish. Chained as
  # `needs:` in this same run: SignPath accepts only an artifact uploaded by
  # the run that requests the signature.
  sign-and-publish:
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # The ceiling for every job in the called workflow.
    permissions:
      actions: read
      contents: write
    uses: Project-Colony/Project-Colony-Resources/.github/workflows/sign-and-publish.yml@619460ff4dc0049f129955f0988d368427b9eedb # main
    with:
      tag: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
      assets: >-
        lilypad-linux lilypad-cli-linux lilypad-tui-linux
        lilypad-windows.exe lilypad-cli-windows.exe lilypad-tui-windows.exe
        lilypad-macos lilypad-cli-macos lilypad-tui-macos
        lilypad-macos-x86 lilypad-cli-macos-x86 lilypad-tui-macos-x86
      artifact-pattern: build-*
      # Uncomment once SignPath has approved this project and its project
      # exists in the Project-Colony SignPath organisation:
      # signpath-project-slug: "lilypad"
    # Named, not `inherit`: the called workflow gets these two and nothing else.
    secrets:
      COLONY_SIGNING_KEY_PEM: ${{ secrets.COLONY_SIGNING_KEY_PEM }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
