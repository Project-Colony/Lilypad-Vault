name: CI

# Third-party actions are pinned to commit SHAs, with the version in a trailing
# comment, and Dependabot moves both together (design/dependencies.md in
# Project-Colony-Resources). A tag can be moved to other code; a SHA cannot.
#
# dtolnay/rust-toolchain is pinned to master with `toolchain: stable` rather
# than to the `stable` branch: that branch is rebased onto every master commit,
# so a SHA pinned on it stops being reachable from any branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job reads the repository and nothing else. A job that needs more asks
# for it in its own block (see "security").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace

  build:
    name: Build All Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --all-targets

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace

      # Release builds compile an OAuth client ID in and the run above has
      # none, so it only tests the "no client id" path. Run the OAuth tests
      # again with one compiled in.
      - name: Test lilypad-oauth with a compiled-in client ID
        if: runner.os == 'Linux'
        run: cargo test -p lilypad-oauth
        env:
          LILYPAD_GITHUB_CLIENT_ID: ci-test-client-id

      # Same check as the release workflow's Windows leg: SignPath signs only
      # an .exe whose version resource names the project and carries its
      # version, and each binary's build.rs is what writes it. Checked here so
      # a pull request that breaks it fails now rather than at the next release.
      - name: Check the Windows version resources
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p lilypad-desktop -p lilypad-cli -p lilypad-tui
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'lilypad-desktop' | ForEach-Object version
          $failed = $false
          foreach ($exe in 'lilypad-desktop.exe', 'lilypad-cli.exe', 'lilypad-tui.exe') {
            $info = (Get-Item "target\debug\$exe").VersionInfo
            "$exe ProductName='$($info.ProductName)' ProductVersion='$($info.ProductVersion)' FileDescription='$($info.FileDescription)'"
            if ($info.ProductName -cne 'Lilypad' -or $info.ProductVersion -cne $version) {
              "::error::$exe has ProductName '$($info.ProductName)' and ProductVersion '$($info.ProductVersion)', expected 'Lilypad' and '$version'"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Cargo.toml promises rust-version = 1.89. Every other job builds on stable,
  # so a dependency bump that raised the floor would pass them all unnoticed.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked

  deny:
    name: Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    # audit-check publishes its findings as a check run. This repository's
    # default workflow token is read-only, so without this block the action
    # dies on "Resource not accessible by integration" before it can report
    # anything at all.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
