[workspace]
members = [
    "lilypad-cli",
    "lilypad-core",
    "lilypad-storage",
    "ui/desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Lilypad Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
