[workspace]
members = [
    "lilypad-cli",
    "lilypad-core",
    "lilypad-storage",
    "ui/desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Lilypad Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
arboard = "3.6.1"
base64 = "0.22.1"
clap = { version = "4.5.54", features = ["derive"] }
csv = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.24.0"
totp-rs = "5.6.0"
