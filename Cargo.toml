[workspace]
members = [
    "lilypad-app",
    "lilypad-cli",
    "lilypad-common",
    "lilypad-core",
    "lilypad-oauth",
    "lilypad-storage",
    "ui/desktop",
    "ui/tui",
]
resolver = "2"

[workspace.package]
# One version for every crate, bumped by release-please (see
# release-please-config.json). It is what `--version` prints and what the
# Windows version resource carries.
version = "0.1.0" # x-release-please-version
edition = "2021"
authors = ["Lilypad Contributors"]
license = "GPL-3.0-or-later"
# The floor CI checks (job "MSRV"); clippy.toml carries the same value.
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1.0.100"
arboard = "3.6.1"
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29"
csv = "1.3.1"
directories = "6.0.0"
fs2 = "0.4.3"
hex = "0.4"
thiserror = "2.0"
rand = "0.10"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3.24.0"
totp-rs = { version = "5.6.0", features = ["zeroize"] }
zeroize = { version = "1.8", features = ["derive"] }
# Build dependency of the three binaries (Windows version resource). No default
# features: they only add a TOML parser for [package.metadata.winresource].
winresource = { version = "0.1.31", default-features = false }
