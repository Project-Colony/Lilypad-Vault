[workspace]
members = [
    "lilypad-cli",
    "lilypad-core",
    "lilypad-storage",
    "ui/desktop",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["Lilypad Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.24.0"
