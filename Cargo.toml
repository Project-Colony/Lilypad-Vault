[workspace]
members = [
    "lilypad-app",
    "lilypad-cli",
    "lilypad-common",
    "lilypad-core",
    "lilypad-oauth",
    "lilypad-storage",
    "ui/desktop",
    "ui/tui",
]
resolver = "2"

[workspace.package]
# One version for every crate, bumped by release-please (see
# release-please-config.json). It is what `--version` prints and what the
# Windows version resource carries.
version = "0.2.0" # x-release-please-version
edition = "2021"
authors = ["Lilypad Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Lilypad-Vault"
# The floor CI checks (job "MSRV"). Clippy reads it too, as its MSRV.
rust-version = "1.89"

# Shared by every Project Colony program (Project-Colony-Resources,
# design/releases.md section 6): thin LTO and one codegen unit for speed and
# size, symbols stripped because users download these binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
arboard = "3.6.1"
assert_cmd = "2.2.2"
base64 = "0.22.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.6.9"
criterion = { version = "0.8.2", features = ["html_reports"] }
crossterm = "0.29.0"
csv = "1.4.0"
directories = "6.0.0"
fs2 = "0.4.3"
hex = "0.4.3"
hostname = "0.4.2"
iced = "0.14.0"
predicates = "3.1.4"
rand = "0.10.3"
ratatui = "0.30.2"
reqwest = { version = "0.12.28", features = ["blocking"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.50.0"
totp-rs = { version = "5.7.0", features = ["zeroize"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.25"
webbrowser = "1.2.4"
whoami = "2.1.3"
zeroize = { version = "1.9.1", features = ["derive"] }
# Build dependency of the three binaries (Windows version resource). No default
# features: they only add a TOML parser for [package.metadata.winresource].
winresource = { version = "0.1.31", default-features = false }
