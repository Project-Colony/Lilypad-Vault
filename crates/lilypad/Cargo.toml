[package]
name = "lilypad"
description = "Lilypad password manager desktop app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# GUI framework
# NOTE: no "image" feature. It is unused (the GUI draws no bitmaps, only Nerd
# Font glyphs and canvas vectors) and it turns on image/default, whose "avif"
# codec drags in ravif -> rav1e, a full AV1 video encoder, plus ~50 crates of
# asm/SIMD code.
iced = { workspace = true, features = ["advanced", "tokio", "canvas"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Lilypad service layer (owns all vault logic)
lilypad-core.workspace = true

# Security
zeroize.workspace = true

# System integration
webbrowser.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
tempfile.workspace = true
